[identity]
name = "小满"
persona = "persona.md"
memory_namespace = "xiaoman"

# M2 defaults to no speech engine so that a clone runs on any OS with zero setup.
# On Windows, "sapi" is the one engine that needs no download:
#   engine = "sapi"
#   model  = "Microsoft Huihui Desktop"     (or leave "none" for the first zh voice)
# Anything OpenAI-compatible (/audio/speech) goes through "http" and the
# ATTUNE_TTS_BASE_URL / ATTUNE_TTS_MODEL environment variables.
[voice]
engine = "none"
model = "none"

# Same discipline for the ear: "none" means the microphone is never opened.
# On Windows, "sapi" is the recogniser that ships with the OS (mediocre but free):
#   engine = "sapi"
#   language = "zh-CN"
# A whisper endpoint goes through "http" and ATTUNE_ASR_BASE_URL / ATTUNE_ASR_MODEL;
# an installed whisper.cpp goes through "cli" with a command containing {audio}.
[asr]
engine = "none"

[renderer]
type = "none"
model = "none"

[mapping]
backchannel_nod = 0.6
turn_take_blink = true
